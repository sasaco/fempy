[project]
name = "FEMPython"
version = "1.0.2"
description = "Python FEM解析モジュール"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
authors = [
    { name = "StructuralEngine" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.3",
    "functions-framework>=3.8.1",
    "numpy>=2.1.0",
    "scipy>=1.14.1",
    "js2py",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "sympy==1.14.0",
    "flet>=0.23.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/fem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "unit: isolated element, solver, material or harness contracts",
    "integration: model assembly, public input routes and physical solutions",
    "regression: saved structural samples and load histories",
    "oracle: independent reference values and provenance validation",
    "material_nonlinear: verified material nonlinear closure scope",
    "slow: expensive complete source-model solve",
    "requires_node: independent original JavaScript evaluator requires Node.js",
]
