name: Publish to PyPI

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  verification:
    name: Reuse the required verification pipeline
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  publish:
    name: Publish the verified artifact
    needs: verification
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/FEMPython/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the artifact produced by verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verification.outputs.artifact_name }}
          path: release

      - name: Check tag, commit, filename, and wheel hash
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.verification.outputs.version }}
          EXPECTED_WHEEL: ${{ needs.verification.outputs.wheel_filename }}
          EXPECTED_WHEEL_SHA256: ${{ needs.verification.outputs.wheel_sha256 }}
        run: |
          test "$GITHUB_REF_NAME" = "v$EXPECTED_VERSION"
          test "$(jq -r '.commit' release/release-manifest.json)" = "$EXPECTED_COMMIT"
          test "$(jq -r '.project.version' release/release-manifest.json)" = "$EXPECTED_VERSION"
          test "$(jq -r '.wheel.filename' release/release-manifest.json)" = "$EXPECTED_WHEEL"
          test "$(jq -r '.wheel.sha256' release/release-manifest.json)" = "$EXPECTED_WHEEL_SHA256"
          jq -r '(.wheel, .sdist) | .sha256 + "  release/packages/" + .filename' \
            release/release-manifest.json | sha256sum --check --strict

      - name: Reject a version that already exists on PyPI
        shell: bash
        env:
          VERSION: ${{ needs.verification.outputs.version }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://pypi.org/pypi/FEMPython/$VERSION/json")
          case "$status" in
            404) echo "FEMPython $VERSION is not present on PyPI." ;;
            200) echo "FEMPython $VERSION already exists on PyPI; refusing to skip or overwrite it." >&2; exit 1 ;;
            *) echo "PyPI version check returned HTTP $status; refusing to publish." >&2; exit 1 ;;
          esac

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/packages
          print-hash: true
