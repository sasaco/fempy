name: FEM verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact_name:
        description: Immutable artifact containing the verified distributions and manifest
        value: ${{ jobs.build_distribution.outputs.artifact_name }}
      version:
        description: Distribution version read from the built wheel
        value: ${{ jobs.build_distribution.outputs.version }}
      wheel_filename:
        description: Verified wheel filename
        value: ${{ jobs.build_distribution.outputs.wheel_filename }}
      wheel_sha256:
        description: SHA-256 of the verified wheel
        value: ${{ jobs.build_distribution.outputs.wheel_sha256 }}

permissions:
  contents: read

concurrency:
  group: fem-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref_type != 'tag' }}

jobs:
  build_distribution:
    name: Build distribution once
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      version: ${{ steps.package.outputs.version }}
      wheel_filename: ${{ steps.package.outputs.wheel_filename }}
      wheel_sha256: ${{ steps.package.outputs.wheel_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.11'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.0'
          enable-cache: true
      - name: Build wheel and source distribution
        run: |
          uv lock --check
          uv build --out-dir release/packages
      - name: Record commit and distribution hashes
        id: package
        run: >-
          python tools/validation/check_distribution.py
          --packages-dir release/packages
          --write-manifest release/release-manifest.json
          --commit "${{ github.sha }}"
          --github-output "$GITHUB_OUTPUT"
          --artifact-name "python-package-distributions-${{ github.sha }}"
      - name: Upload the only publishable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  source_quality:
    name: Full source, nonlinear, metadata, and Wiki verification
    needs: build_distribution
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.0'
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Verify material nonlinear closure
        run: >-
          uv run --locked --extra dev python -m pytest
          -m material_nonlinear -q
          --junitxml=tmp/ci/material-nonlinear.xml
      - name: Verify the complete suite with no skips
        run: >-
          uv run --locked --extra dev python -m pytest tests -q
          --junitxml=tmp/ci/complete-suite.xml
      - name: Verify Wiki source examples
        run: uv run --locked --extra dev python -m tools.validation.check_wiki
      - name: Upload source verification records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-quality-results-${{ github.sha }}
          path: tmp/ci/*.xml
          if-no-files-found: warn
          retention-days: 30

  wheel_smoke:
    name: Wheel / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: build_distribution
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Download the distribution built by this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build_distribution.outputs.artifact_name }}
          path: release
      - name: Verify artifact bytes and commit provenance
        run: >-
          python tools/validation/check_distribution.py
          --packages-dir release/packages
          --verify-manifest release/release-manifest.json
          --commit "${{ github.sha }}"
      - name: Install and exercise the wheel outside the checkout
        run: >-
          python -I tools/validation/check_wheel_install.py
          --packages-dir release/packages
          --expected-version "${{ needs.build_distribution.outputs.version }}"
