# Codex project configuration for FrameWeb3.
model = "gpt-6-sol"
model_reasoning_effort = "high"
model_reasoning_summary = "detailed"
web_search = "live"
approval_policy = "never"

# Least-privilege default. Implementation calls opt in with
# `--sandbox workspace-write`; use `danger-full-access` only when the requested
# task genuinely requires access outside the workspace.
sandbox_mode = "read-only"

[features]
skills = true

[[skills.config]]
enabled = true
path = ".agents/skills/context-loader"

[[skills.config]]
enabled = true
path = ".agents/skills/design-tracker"

verbosity = "medium"
